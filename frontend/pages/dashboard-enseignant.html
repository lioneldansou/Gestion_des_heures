<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Enseignant</title>
    <link rel="stylesheet" href="../css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard-enseignant.css">
</head>
<body>

<div class="container">

    <aside class="sidebar">
        <h2><i class="fas fa-graduation-cap"></i> TPG</h2>
        <ul>
            <li><a href="dashboard-enseignant.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="mes-heures.html"><i class="fas fa-clock"></i> Mes Heures</a></li>
            <li><a href="../index.html"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
        </ul>
    </aside>

    <main class="main">
        <h1>Tableau de bord</h1>
        <p class="subtitle">Bienvenue, voici un aperçu de vos heures</p>

        <div class="stats">
            <div class="card card-1">
                <i class="fas fa-clock"></i>
                <h3>Total Heures</h3>
                <p class="nombre">0</p>
            </div>
            <div class="card card-2">
                <i class="fas fa-chalkboard"></i>
                <h3>Heures CM</h3>
                <p class="nombre">0</p>
            </div>
            <div class="card card-3">
                <i class="fas fa-users"></i>
                <h3>Heures TD</h3>
                <p class="nombre">0</p>
            </div>
            <div class="card card-4">
                <i class="fas fa-flask"></i>
                <h3>Heures TP</h3>
                <p class="nombre">0</p>
            </div>
        </div>
    </main>

</div>

<script src="../js/dashboard-enseignant.js"></script>
</body>
</html>
