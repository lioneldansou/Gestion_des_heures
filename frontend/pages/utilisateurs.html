<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Utilisateurs</title>
    <link rel="stylesheet" href="../css/all.min.css">
    <link rel="stylesheet" href="../css/utilisateurs.css">
</head>
<body>

<div class="container">

    <aside class="sidebar">
        <h2><i class="fas fa-graduation-cap"></i> TPG</h2>
        <ul>
            <li><a href="dashboard-admin.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="utilisateurs.html"><i class="fas fa-users"></i> Utilisateurs</a></li>
            <li><a href="departements.html"><i class="fas fa-building"></i> Départements</a></li>
            <li><a href="parametres.html"><i class="fas fa-cog"></i> Paramètres</a></li>
            <li><a href="../index.html"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
        </ul>
    </aside>

    <main class="main">
        <h1>Gestion des utilisateurs</h1>

        <button class="btn-ouvrir" onclick="ouvrirModal()">
            <i class="fas fa-plus"></i> Ajouter un utilisateur
        </button>

        <div class="modal" id="modal">
            <div class="modal-contenu">
                <h2>Ajouter un utilisateur</h2>
                <div class="form-container">
                    <input type="text" id="nom" placeholder="Nom">
                    <input type="text" id="prenom" placeholder="Prénom">
                    <input type="email" id="email" placeholder="Email">
                    <input type="password" id="mot_de_passe" placeholder="Mot de passe">
                    <select id="role">
                        <option value="">Rôle</option>
                        <option value="admin">Admin</option>
                        <option value="rh">RH</option>
                        <option value="enseignant">Enseignant</option>
                    </select>
                </div>
                <div class="modal-boutons">
                    <button class="btn-annuler" onclick="fermerModal()">Annuler</button>
                    <button class="btn-ajouter" id="btnAjouter">Ajouter</button>
                </div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Email</th>
                    <th>Rôle</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>

</div>

<script src="../js/utilisateurs.js"></script>
</body>
</html>
